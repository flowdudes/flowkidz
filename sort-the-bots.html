*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#2E7A2C;overflow:hidden;font-family:'Nunito',sans-serif;color:#2B3A24}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1200px;height:720px;flex:none;position:relative;background:#8ecfee;overflow:hidden;transform-origin:center center}
#topbar{position:absolute;top:0;left:0;right:0;height:84px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#2E7A2C;border-bottom:5px solid #1E5A1E;z-index:50}
#topbar.hidden{display:none}
.iconbtn{width:56px;height:56px;border-radius:16px;border:4px solid #1E5A1E;background:#FFD34D;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);flex:none}
.iconbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.iconbtn svg{display:block}
#gametitle{font-family:'Caveat Brush';font-size:40px;color:#FFF8E7;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
#dayTabs{display:flex;gap:8px;margin-left:10px;align-items:center}
.daylab{font-weight:900;font-size:15px;color:#FFF8E7;letter-spacing:2px}
.dtab{width:46px;height:46px;border-radius:50%;border:4px solid #1E5A1E;background:#cfe0c2;font-family:'Caveat Brush';font-size:22px;color:#5a6b52;display:flex;align-items:center;justify-content:center;opacity:.6}
.dtab.on{opacity:1;background:#FFD34D;color:#2B3A24;box-shadow:0 0 14px #FFD34D}
.dtab.done{opacity:1;background:#7ed07e;color:#1E5A1E}
#applehud{margin-left:auto;display:flex;align-items:center;gap:8px;background:#FFF8E7;border:4px solid #1E5A1E;border-radius:16px;padding:6px 14px}
#applehud .ah{width:34px;height:34px}
#applehud .ah svg{width:100%;height:100%;display:block}
#screens{position:absolute;top:84px;left:0;right:0;bottom:0}
#topbar.hidden+#screens{top:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.hidden{display:none!important}
.bigtitle{font-family:'Caveat Brush';color:#2B3A24;text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.5)}
.btn{font-family:'Caveat Brush';font-size:30px;color:#2B3A24;background:#FFD34D;border:4px solid #2B3A24;border-radius:20px;padding:12px 46px;cursor:pointer;box-shadow:0 6px 0 #2B3A24;letter-spacing:1px;min-height:64px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2B3A24}
.btn.green{background:#7ed07e}
.btn.cream{background:#FFF8E7}
.btn.barn{background:#C0392B;color:#fff}
.hand{font-family:'Caveat Brush';font-size:24px;color:#7B5CFF}
.card{background:#FFF8E7;border:4px solid #2B3A24;border-radius:20px;box-shadow:0 6px 0 rgba(43,58,36,.18)}
.speech{position:relative;background:#fff;border:4px solid #2B3A24;border-radius:18px;padding:12px 18px;font-weight:800;font-size:19px;max-width:340px;color:#2B3A24}
.speech:after{content:'';position:absolute;bottom:-16px;left:40px;border:8px solid transparent;border-top:12px solid #2B3A24}
.badgepill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid #2B3A24;border-radius:999px;padding:6px 16px;font-weight:900;font-size:15px}
.readbtn{cursor:pointer;margin-left:8px;vertical-align:middle;display:inline-flex}
.readbtn svg{display:block}
/* farm backdrop */
.farm{position:absolute;inset:0;background:linear-gradient(#9ed7f2 0 56%,#7cc46a 56% 100%);overflow:hidden;pointer-events:none;z-index:-1}
.farm .rowarc{position:absolute;bottom:-40px;width:340px;height:200px;border:14px solid rgba(46,122,44,.28);border-top:none;border-left:none;border-right:none;border-radius:50%}
/* --- board-fidelity + micro-interactions --- */
.sunhalo{animation:sunbreathe 4s ease-in-out infinite}
@keyframes sunbreathe{50%{transform:scale(1.08)}}
.cloud{animation:clouddrift 9s ease-in-out infinite}
.cloud.c2{animation-duration:12s}.cloud.c3{animation-duration:10.5s;animation-delay:1.2s}
@keyframes clouddrift{50%{transform:translateX(26px)}}
.fpost{position:absolute;width:14px;height:70px;background:#6B4226;border:3px solid #3E2412;border-radius:6px}
.barn .barndoor{transition:transform .45s ease;transform-box:fill-box;transform-origin:0% 50%}
.barn.ajar .barndoor{transform:translateX(-9px) skewY(-4deg)}
.barn .chick{transition:opacity .4s ease}
.barn.ajar .chick{opacity:1}
.machine .mscreen{position:relative;overflow:hidden}
.machine.sot{width:300px}
.sot-top{position:relative;height:66px}
.sot-cap{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:76px;height:34px;background:#B9C2E8;border:5px solid #2B3A24;border-bottom:none;border-radius:16px 16px 0 0}
.sot-f{position:absolute;bottom:2px;width:58px;height:58px;z-index:2}
.sot-f.a{left:calc(50% - 82px);transform:rotate(-8deg)}
.sot-f.b{right:calc(50% - 82px);transform:rotate(8deg)}
.sot-f svg{width:100%;height:100%}
.sot-body{position:relative;background:#B9C2E8;border:5px solid #2B3A24;border-radius:30px;padding:26px 22px 28px}
.sot-dots{display:flex;gap:12px;justify-content:center;margin-top:14px}
.sot-dots i{width:20px;height:20px;border-radius:50%;border:3px solid #2B3A24;background:#E74C3C}
.sot-dots i.g{background:#2ECC71}
.sot-arm{position:absolute;top:64px;width:34px;height:112px;background:#B9C2E8;border:5px solid #2B3A24;border-radius:17px;z-index:-1}
.sot-arm.l{left:-28px;transform:rotate(22deg)}
.sot-arm.r{right:-28px;transform:rotate(-22deg)}
.machine.thinking .sot-dots i{animation:dotseq .9s infinite}
.machine.thinking .sot-dots i:nth-child(2){animation-delay:.15s}
.machine.thinking .sot-dots i:nth-child(3){animation-delay:.3s}
.machine.thinking .sot-dots i:nth-child(4){animation-delay:.45s}
@keyframes dotseq{0%,100%{filter:brightness(1)}50%{filter:brightness(1.7);transform:scale(1.25)}}
.machine.thinking .mscreen::after{content:'';position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(100deg,transparent,rgba(69,227,255,.35),transparent);animation:scan 1s linear infinite;pointer-events:none}
@keyframes scan{from{left:-40%}to{left:100%}}
.mscreen.xflash::before{content:'';position:absolute;inset:6px;border-radius:12px;background:rgba(192,57,43,.45);animation:xflash .55s ease;z-index:5;pointer-events:none}
@keyframes xflash{0%{opacity:0;transform:scale(.6)}40%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1)}}
.botsy-live{cursor:pointer;transition:transform .18s ease}
.botsy-live:hover{transform:rotate(-4deg) scale(1.04)}
.botsy-live.botsy-hop{animation:botsyhop .7s ease}
@keyframes botsyhop{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-26px) rotate(-8deg)}55%{transform:translateY(0) rotate(6deg)}75%{transform:translateY(-12px) rotate(-4deg)}100%{transform:translateY(0) rotate(0)}}
.basket{overflow:hidden}
@keyframes bwiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}
.basket.bwiggle{animation:bwiggle .5s ease}
.basket::after{content:'';position:absolute;top:-10%;bottom:-10%;left:0;width:34%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:translateX(-160%) skewX(-16deg);pointer-events:none;z-index:4}
.basket.bshine::after{animation:bshine .6s ease}
@keyframes bshine{to{transform:translateX(480%) skewX(-16deg)}}
@keyframes fruitpop{0%{transform:scale(1)}40%{transform:scale(1.18,.84)}70%{transform:scale(.93,1.09)}100%{transform:scale(1)}}
.fruit-pop{animation:fruitpop .24s ease}
#bStart{animation:btnpulse 2.2s ease-in-out infinite}
@keyframes btnpulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.floaty,.botsy-live,.botsy-live.botsy-hop,.sunhalo,.cloud{animation:none!important}}
#toast{position:absolute;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:#2B3A24;color:#fff;font-weight:900;font-size:20px;padding:14px 30px;border-radius:16px;opacity:0;transition:all .25s;z-index:200;pointer-events:none;max-width:82%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:absolute;top:-20px;width:12px;height:18px;z-index:150;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(780px) rotate(720deg)}}
.shake{animation:shk .4s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.floaty{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-10px)}}
.hintpulse{animation:hpulse .7s ease-in-out 3}
@keyframes hpulse{50%{transform:scale(1.1);box-shadow:0 0 0 7px #FFD34D}}
#dragghost{position:fixed;z-index:500;pointer-events:none;opacity:.94;transform:translate(-50%,-50%) rotate(-4deg);width:72px;height:72px}
#dragghost svg{width:100%;height:100%}
.thinkdots span{animation:blink 1s infinite}
.thinkdots span:nth-child(2){animation-delay:.2s}.thinkdots span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
/* wood sign (title) */
.woodsign{background:linear-gradient(#7A4E2C,#6B4226);border:6px solid #3E2412;border-radius:14px;padding:26px 60px;box-shadow:0 8px 0 rgba(43,58,36,.3);text-align:center;position:relative;transform:rotate(-4deg)}
.woodsign::before{content:'';position:absolute;inset:5px;border-radius:9px;background:repeating-linear-gradient(0deg,transparent 0 30px,rgba(0,0,0,.15) 30px 33px);pointer-events:none}
.woodsign h1,.woodsign p{position:relative;z-index:1}
.woodsign h1{font-family:'Caveat Brush';font-size:84px;color:#FFF8E7;text-shadow:0 3px 0 #5b3a1e;letter-spacing:2px}
.woodsign p{font-family:'Caveat Brush';font-size:26px;color:#FFE9B8;margin-top:2px}
/* crate panel */
.crate{background:linear-gradient(#b07a45,#A8692E);border:5px solid #5b3a1e;border-radius:16px;padding:12px 16px;box-shadow:0 6px 0 rgba(43,58,36,.25)}
.crate .clabel{font-family:'Caveat Brush';font-size:22px;color:#FFF8E7;letter-spacing:2px;text-align:center;margin-bottom:8px;text-shadow:0 2px 0 #5b3a1e}
.cratefruits{display:grid;grid-template-columns:repeat(3,76px);gap:10px;justify-content:center}
.fruitbtn{width:76px;height:76px;border-radius:18px;background:#FFF8E7;border:4px solid #2B3A24;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 0 rgba(43,58,36,.25)}
.fruitbtn svg{width:58px;height:58px;pointer-events:none}
.fruitbtn.sel{box-shadow:0 0 0 6px #FFD34D;transform:scale(1.06)}
.fruitbtn:active{cursor:grabbing}
/* baskets */
.basket{position:relative;width:230px;cursor:pointer;user-select:none}
.basket .blabel{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;background:#FFF8E7;border:3px solid #2B3A24;border-radius:12px;padding:4px 18px;font-family:'Caveat Brush';font-size:22px;z-index:3}
.basket .pile{position:absolute;left:0;right:0;bottom:28px;height:108px;pointer-events:none}
.basket .pile .pf{position:absolute;width:52px;height:52px;pointer-events:auto;cursor:pointer}
.basket .pile .pf svg{width:100%;height:100%}
.basket .pf.wrongring{filter:drop-shadow(0 0 6px #C0392B)}
.basket.hot .bbody{filter:drop-shadow(0 0 10px #FFD34D)}
/* brain meter */
.brainpanel{background:#23232e;border:4px solid #101018;border-radius:16px;padding:12px 18px;width:250px;color:#fff}
.brainpanel .bl{font-weight:900;font-size:14px;letter-spacing:2px;color:#9fe8ff}
.brainpanel .bar{height:22px;background:#101018;border-radius:11px;margin:8px 0;overflow:hidden;border:2px solid #3a3a4a}
.brainpanel .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7B5CFF,#45E3FF);border-radius:11px;transition:width .5s}
.brainpanel.mixed .bar i{background:linear-gradient(90deg,#FF9F2E,#C0392B)}
.brainpanel .pct{font-family:'Caveat Brush';font-size:24px;color:#9fe8ff}
.brainpanel.mixed .pct{color:#FF9F2E}
/* callout pill */
.callout{background:#FFD34D;border:4px solid #2B3A24;border-radius:999px;padding:10px 28px;font-family:'Caveat Brush';font-size:26px;color:#2B3A24;box-shadow:0 4px 0 rgba(43,58,36,.3);display:inline-flex;align-items:center}
/* machine */
.machine{position:relative;width:300px}
.machine .mscreen{background:#23232e;border:5px solid #2B3A24;border-radius:18px;color:#45E3FF;font-family:'Caveat Brush';font-size:30px;letter-spacing:2px;text-align:center;padding:14px 8px;min-height:70px}
.machine .mbody{position:relative;height:170px}
.machine .chute{position:absolute;bottom:0;width:90px;height:120px;background:#b9c2d9;border:4px solid #2B3A24;transform:skewX(-18deg)}
.machine .chute.r{right:6px;transform:skewX(18deg)}
.machine .chute.l{left:6px}
.machine .slot{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#101018;border:4px solid #2B3A24;border-radius:8px}
.machine .lights{display:flex;gap:10px;justify-content:center;margin-top:8px}
.machine .lights i{width:18px;height:18px;border-radius:50%;background:#C0392B;border:3px solid #2B3A24}
.machine .lights i.g{background:#7ed07e}
.machine .lights i.y{background:#FFD34D}
.testfruit{position:absolute;width:64px;height:64px;z-index:20;transition:left .55s ease-in,top .55s ease-in}
.testfruit svg{width:100%;height:100%}
.verdict{position:absolute;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid #2B3A24;z-index:21}
.verdict.ok{background:#7ed07e}.verdict.no{background:#C0392B}
.verdict svg{display:block}
/* day3 cards */
.d3grid{display:grid;grid-template-columns:repeat(4,168px);gap:16px}
.d3card{background:#FFF8E7;border:4px solid #2B3A24;border-radius:18px;padding:8px 6px 6px;text-align:center;cursor:pointer;position:relative;user-select:none;min-height:150px}
.d3card svg{width:74px;height:74px;pointer-events:none}
.d3card .tag{display:inline-block;margin-top:6px;background:#fff;border:3px solid #2B3A24;border-radius:10px;padding:4px 14px;font-weight:900;font-size:15px;letter-spacing:1px;transition:transform .3s}
.d3card.flipping .tag{animation:flip .35s}
@keyframes flip{50%{transform:rotateY(90deg)}}
.d3card .okbadge{position:absolute;top:-12px;right:-12px;width:44px;height:44px;border-radius:50%;background:#7ed07e;border:4px solid #2B3A24;display:flex;align-items:center;justify-content:center}
.d3card .okbadge svg{display:block}
.d3card.badflash{animation:badfl .5s}
@keyframes badfl{30%{background:#ffd9d9}}
/* memory shelf */
.memcard{background:#FFF8E7;border:4px solid #2B3A24;border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 rgba(43,58,36,.18)}
.memcard .mtitle{font-family:'Caveat Brush';font-size:24px;text-align:center;margin-bottom:8px}
.memgrid{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.memgrid .mf{width:64px;height:64px;background:#fff;border:3px solid #2B3A24;border-radius:12px;display:flex;align-items:center;justify-content:center}
.memgrid .mf svg{width:46px;height:46px}
.addslot{border:4px dashed #2E7A2C;border-radius:14px;min-height:84px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;padding:8px;font-family:'Caveat Brush';font-size:22px;color:#2E7A2C;background:rgba(255,255,255,.5)}
.addslot svg{width:40px;height:40px;flex:none}
/* win */
.ribbonwrap{position:relative;width:230px;height:280px}
.learncard{background:#FFF8E7;border:4px solid #2B3A24;border-radius:20px;padding:18px 24px;box-shadow:0 6px 0 rgba(43,58,36,.18);min-width:340px}
.learncard h3{font-family:'Caveat Brush';font-size:30px;margin-bottom:10px}
.learnrow{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;padding:5px 0}
.learnrow .lb{width:34px;height:34px;border-radius:50%;background:#7ed07e;border:3px solid #2B3A24;flex:none;display:flex;align-items:center;justify-content:center}
.learnrow .lb svg{display:block}
</style>
</head>

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{

 else if(S.screen==='day1'){
  const idx=parseInt(e.key)-1;
  if(idx>=0&&S.d1){const cf=S.d1.fruits.filter(f=>f.placed==='crate');if(idx<cf.length)tapFruit(cf[idx].id)}
  if(e.key==='a'||e.key==='A'){if(S.sel!=null)placeFruit(S.sel,'apples')}
  if(e.key==='b'||e.key==='B'){if(S.sel!=null)placeFruit(S.sel,'bananas')}
  if(e.key==='Enter'){const b=$('#bTest1');if(b&&!b.classList.contains('hidden'))b.click()}
 }else if(S.screen==='day1test'&&e.key==='Enter'){const b=$('#bNext2:not(.hidden)')||$('#bFix1:not(.hidden)');if(b)b.click()}

  const idx=parseInt(e.key)-1;
  if(idx>=0&&S.d2){const tf=S.d2.tray.filter(f=>f.placed==='tray');if(idx<tf.length)tapGreen(tf[idx].id)}
  if(e.key==='a'||e.key==='A'){if(S.sel!=null)placeGreen(S.sel,'apples')}
  if(e.key==='b'||e.key==='B'){if(S.sel!=null)placeGreen(S.sel,'bananas')}

window.addEventListener('message',e=>{
