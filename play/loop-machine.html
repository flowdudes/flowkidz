*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1E3A3F;font-family:'Nunito',sans-serif;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1E3A3F}
#stage{position:relative;width:1200px;height:720px;flex:0 0 auto;transform-origin:center center;overflow:hidden;background:#1E3A3F;border-radius:18px}
h1,h2,.ram{font-family:'Rammetto One',cursive;font-weight:400}
button{font-family:'Nunito',sans-serif}
/* ---------- shared chrome ---------- */
.topbar{position:absolute;top:0;left:0;right:0;height:104px;background:#241811;display:flex;align-items:center;padding:0 28px;gap:18px;z-index:50;border-bottom:6px solid #B8683A}
.topbar .ttl{font-family:'Rammetto One';font-size:34px;color:#CB963E;letter-spacing:2px}
.xbtn{width:60px;height:60px;border-radius:16px;border:4px solid #0A0F0E;background:#CB963E;color:#241811;font-size:30px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.xbtn svg{display:block}
/* --- board-fidelity + micro-interactions --- */
.biggear{animation:gearspin 26s linear infinite}
@keyframes gearspin{to{transform:rotate(360deg)}}
body.cranking .biggear{animation-duration:1.1s}
.gearwrap{position:relative;display:inline-block}
.gearwrap::after{content:'';position:absolute;inset:-14px;border:5px dashed rgba(244,230,200,0);border-radius:50%;transition:border-color .3s;pointer-events:none}
body.cranking .gearwrap::after{border-color:rgba(244,230,200,.75);animation:gearspin .8s linear infinite}
.hoop{animation:hooppulse 2.6s ease-in-out infinite}
@keyframes hooppulse{50%{filter:drop-shadow(0 0 10px rgba(244,230,200,.6))}}
body.cranking #hoops .hoop{animation:hoopripple .8s ease-in-out infinite}
@keyframes hoopripple{0%,100%{filter:drop-shadow(0 0 4px rgba(43,217,142,.3));transform:scale(1)}50%{filter:drop-shadow(0 0 16px rgba(43,217,142,.9));transform:scale(1.06)}}
.puff.steam{animation:steamup 3s ease-in-out infinite}
@keyframes steamup{0%{transform:translateY(8px) scale(.8);opacity:0}30%{opacity:.9}100%{transform:translateY(-26px) scale(1.25);opacity:0}}
.chip-live{cursor:pointer;display:inline-block;transition:transform .18s ease}
.chip-live:hover{transform:rotate(-3deg) scale(1.03)}
.chip-live .chip-bob{animation:chipbob 3.4s ease-in-out infinite}
@keyframes chipbob{50%{transform:translateY(-8px)}}
.chip-hat{transform-box:fill-box;transform-origin:25% 85%;transition:transform .35s ease}
.chip-live.hattip .chip-hat{transform:rotate(-16deg) translateY(-4px)}
body.cranking .chip-live .chip-hat{transform:rotate(-16deg)}
body.cranking .chip-live .chip-bob{animation:chipbounce .5s ease infinite}
@keyframes chipbounce{50%{transform:translateY(-16px)}}
.chip-live.chip-hop{animation:chiphop .65s ease}
@keyframes chiphop{0%{transform:translateY(0)}35%{transform:translateY(-24px) rotate(5deg)}70%{transform:translateY(0)}100%{transform:translateY(0)}}
.countspin{animation:countspin .45s ease}
@keyframes countspin{50%{transform:rotate(180deg) scale(1.35)}100%{transform:rotate(360deg)}}
.btn.red:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.bwob svg{animation:bwobble .5s ease;transform-box:fill-box;transform-origin:center}
@keyframes bwobble{0%,100%{transform:rotate(0)}25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}
.gslide svg{animation:gslide .4s ease}
@keyframes gslide{0%{transform:scale(.96)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.floaty,.hoop,.biggear,.chip-live .chip-bob,.gearwrap::after,.puff.steam{animation:none!important}}
.xbtn:active{transform:scale(.94)}
.mutebtn{width:60px;height:60px;border-radius:16px;border:4px solid #0A0F0E;background:#CB963E;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mutebtn:active{transform:scale(.94)}
.mutebtn svg{width:30px;height:30px}
.acttabs{display:flex;gap:10px;align-items:center;margin-left:8px}
.acttabs .alab{font-family:'Rammetto One';font-size:15px;color:#CB963E;letter-spacing:1px}
.ticket{min-width:64px;height:56px;border:0;cursor:default;display:flex;align-items:center;justify-content:center;font-family:'Rammetto One';font-size:22px;color:#F4E6C8;background:#4a3a2c;clip-path:polygon(8% 0,92% 0,100% 18%,100% 82%,92% 100%,8% 100%,0 82%,0 18%);padding:0 18px}
.ticket.on{background:#D94B3A;color:#fff}
.ticket.done{background:#2BD98E;color:#0A0F0E}
.gearprog{margin-left:auto;display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.25);border:3px solid #CB963E;border-radius:999px;padding:8px 18px}
.gearprog .gp{width:44px;height:44px;border-radius:50%;border:3px dashed rgba(244,230,200,.35);display:flex;align-items:center;justify-content:center}
.gearprog .gp svg{width:30px;height:30px;opacity:.35}
.gearprog .gp.lit{border-style:solid;border-color:#CB963E}
.gearprog .gp.lit svg{opacity:1}
/* ---------- panels & cards ---------- */
.panel{background:#2b1d14;border:5px solid #CB963E;border-radius:20px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.panel .rivet{position:absolute;width:16px;height:16px;border-radius:50%;background:#CB963E;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.plabel{font-family:'Rammetto One';font-size:22px;color:#CB963E;letter-spacing:2px}
.pcard{background:#F4E6C8;border:4px solid #0A0F0E;border-radius:14px;min-height:64px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#241811;position:relative;padding:10px 18px 10px 34px;cursor:grab;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.pcard::before{content:'';position:absolute;left:12px;top:10px;bottom:10px;width:8px;background-image:radial-gradient(circle,#b9a67f 3px,transparent 3.5px);background-size:8px 14px;background-repeat:repeat-y}
.pcard.ghost{opacity:.45}
.btn{font-family:'Rammetto One';font-size:26px;letter-spacing:1px;border:4px solid #0A0F0E;border-radius:999px;padding:16px 44px;cursor:pointer;color:#241811;background:#CB963E;box-shadow:0 6px 0 rgba(0,0,0,.35);min-height:64px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.red{background:#D94B3A;color:#FFF6E8}
.btn.green{background:#2BD98E}
.btn.cream{background:#F4E6C8}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.coach{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;background:#2b1d14;border:4px solid #CB963E;border-radius:18px;padding:14px 26px;display:flex;gap:16px;align-items:center;max-width:760px;box-shadow:0 6px 0 rgba(0,0,0,.4);pointer-events:none}
.coach p{color:#F4E6C8;font-size:21px;font-weight:800;line-height:1.35}
.coach p b{color:#CB963E}
.hintpulse{animation:hpulse 1s ease-in-out infinite}
@keyframes hpulse{0%,100%{box-shadow:0 0 0 0 rgba(43,217,142,.0)}50%{box-shadow:0 0 0 12px rgba(43,217,142,.55)}}
.shake{animation:shk .5s}
@keyframes shk{0%,100%{translate:0 0}20%{translate:-14px 0}40%{translate:12px 0}60%{translate:-8px 0}80%{translate:6px 0}}
.clanktxt{font-family:'Rammetto One';font-size:64px;color:#D94B3A;transform:rotate(-12deg);text-shadow:3px 3px 0 #0A0F0E;animation:clankpop .5s ease-out}
@keyframes clankpop{0%{transform:rotate(-12deg) scale(.3);opacity:0}60%{transform:rotate(-12deg) scale(1.25);opacity:1}100%{transform:rotate(-12deg) scale(1)}}
.hoop{transition:all .3s}
.saybtn{position:absolute;width:56px;height:56px;border-radius:50%;background:#CB963E;border:4px solid #0A0F0E;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:55}
.saybtn svg{width:28px;height:28px}
.saybtn:active{transform:scale(.92)}
#draglayer{position:absolute;inset:0;pointer-events:none;z-index:200}
.dragging{pointer-events:none;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%) scale(.9);background:#241811;color:#F4E6C8;border:4px solid #CB963E;border-radius:16px;padding:14px 30px;font-size:22px;font-weight:900;opacity:0;transition:all .25s;z-index:400;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.firework{position:absolute;pointer-events:none;z-index:90}
.confetti{position:absolute;width:12px;height:18px;z-index:95;pointer-events:none}
@keyframes fall{to{transform:translateY(760px) rotate(720deg);opacity:.9}}
.puff{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(244,230,200,.85),rgba(244,230,200,0));pointer-events:none;animation:puffup 1.2s ease-out forwards;z-index:80}
@keyframes puffup{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.8) translateY(-40px);opacity:0}}

function tone(f,d,type,vol,when){if(muted)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;const t=c.currentTime+(when||0);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)}

 clank(){tone(140,.3,'sawtooth',.2);tone(90,.4,'square',.15,.05);tone(220,.2,'sawtooth',.1,.1)},
 gear(){[523,659,784].forEach((f,i)=>tone(f,.15,'triangle',.14,i*.09))},

 <div id="dock" style="position:absolute;bottom:8px;left:16px;right:16px;display:flex;justify-content:center;align-items:flex-end;gap:12px;flex-wrap:wrap;z-index:40">

  <div id="cardTray3" style="display:flex;flex-direction:column;gap:10px">${['pump air','let air out'].map(c=>punchCard(c,'tray3_'+c,'style="min-width:160px;min-height:56px;font-size:20px"')).join('')}</div>

 wireTop();
 $$('#blkTray [data-blk]').forEach(b=>makeDraggable(b,'block:'+b.dataset.blk,dropBlockA3));
 $$('#cardTray3 .pcard').forEach(c=>makeDraggable(c,'card:'+c.textContent.trim(),dropCardA3));
 $('#bCrank3').onclick=crankA3;roundPost(3)}
function dropBlockA3(kind){if(S.a3.block||S.a3.done||S.cranking)return;sfx.gear();S.a3.block=kind;
 const u=kind==='until';
 $('#prog3Body').innerHTML=repeatBlockHTML({static:true,until:u?'balloon is big':null,count:u?undefined:3,countId:'a3Cnt',slotH:120,id:'a3Block',
  inner:'<div class="dashedslot" id="a3Slot">drop a card inside</div>'+(u?'':'<div style="text-align:center"><button class="stepbtn" id="a3Minus" style="display:inline-flex">−</button><button class="stepbtn" id="a3Plus" style="display:inline-flex;margin-left:8px">+</button></div>')});
 if(!u){let c=3;$('#a3Minus').onclick=()=>{if(c>1){c--;$('#a3Cnt').textContent=c;S.a3.count=c;sfx.click()}};$('#a3Plus').onclick=()=>{if(c<6){c++;$('#a3Cnt').textContent=c;S.a3.count=c;sfx.click()}};S.a3.count=3}
 const tap=$('#a3Block');tap.style.cursor='pointer';tap.title='Tap to remove';
 tap.onclick=e=>{if(e.target.closest('.stepbtn')||S.cranking)return;showAct3()};
 toast(u?'REPEAT UNTIL placed! Now drop the pump air card inside.':'REPEAT placed. Hmm — no count was given...')}
function dropCardA3(card){if(!S.a3.block||S.a3.card||S.a3.done||S.cranking)return;const slot=$('#a3Slot');if(!slot)return;
 sfx.pop();S.a3.card=card;
 slot.outerHTML=punchCard(card,'a3InSlot','style="min-height:52px;font-size:20px;cursor:pointer" id="a3InSlot"');
 $('#a3InSlot').onclick=e=>{e.stopPropagation();if(S.cranking)return;sfx.click();S.a3.card=null;$('#a3InSlot').outerHTML='<div class="dashedslot" id="a3Slot">drop a card inside</div>'};
 toast('Card in! Press CRANK IT!',2200,'70%')}
function crankA3(){if(S.cranking||S.a3.done)return;
 if(!S.a3.block){toast('Drop a REPEAT block into the PROGRAM first!');sfx.click();return}
 if(!S.a3.card){toast('Drop a card inside the block first!');sfx.click();return}
 S.cranking=true;document.body.classList.add('cranking');sfx.crank();$('#bCrank3').disabled=true;const c=$('.coach');if(c)c.remove();$('#clank3').style.display='none';
 const until=S.a3.block==='until',pump=S.a3.card==='pump air';
 $('#pumpTxt').style.opacity=1;S.a3.pct=0;updBalloon();
 const target=until&&pump?8:(S.a3.count||3);let i=0;
 function tick(){if(S.screen!=='act3run')return;
  if(i<target){sfx.pump();const pt=$('#pumpTop');if(pt){pt.style.transform='translateY(10px)';setTimeout(()=>pt.style.transform='',150)}
   S.a3.pct=Math.min(100,S.a3.pct+(pump?13:-10));updBalloon();i++;later(tick,420);return}
  $('#pumpTxt').style.opacity=0;
  if(until&&pump){a3Win();return}
  // fail
  if(!pump){sfx.clank();$('#clank3').style.display='block';$('#clank3').firstElementChild.textContent='PFFT!'}
  else{sfx.clank();$('#clank3').style.display='block';$('#clank3').firstElementChild.textContent='TOO SMALL!'}
  stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),550);
  miss(2);S.cranking=false;document.body.classList.remove('cranking');$('#bCrank3').disabled=false;S.screen='act3';
  const why=!until?"A number can't do it — <b>nobody gave you a count!</b> Try <b>REPEAT UNTIL</b>.":(!pump?"<b>Letting air out</b> won't help — use <b>pump air</b>.":"Still too small!");
  stage.insertAdjacentHTML('beforeend',coachHTML(why+'<br>The sensor stops the loop at 100%.','worried','bottom:236px'))}
 S.screen='act3run';later(tick,500)}
function updBalloon(){const p=Math.max(0,Math.round(S.a3.pct));const bb=$('#balloonBox');bb.innerHTML=balloonSVG(p);bb.classList.remove('bwob');void bb.offsetWidth;bb.classList.add('bwob');const gb=$('#gaugeBox');gb.innerHTML=gaugeSVG(p);gb.classList.remove('gslide');void gb.offsetWidth;gb.classList.add('gslide')}
function a3Win(){S.a3.done=true;S.cranking=false;S.screen='act3';document.body.classList.remove('cranking');S.gears[2]=S.misses[2]===0;sfx.win();confettiBurst(80);
 stage.insertAdjacentHTML('beforeend',`<div class="coach" style="border-color:#2BD98E;bottom:120px"><div style="flex:0 0 auto">${chipSVG('proud',64)}</div><p><b style="color:#2BD98E">BIG BALLOON!</b> The loop stopped itself at 100% — no counting!</p></div>`);
 $('#dock').innerHTML=`<button class="btn" id="bFinish" style="font-size:28px">FINISH</button>`;
 $('#bFinish').onclick=()=>{sfx.pop();showWin()}}
/* ---------- WIN: loop legend ---------- */
function showWin(){S.screen='win';S.act=0;
 const stars=S.gears.filter(Boolean).length;
 const lessons=['A loop repeats cards for you','Set the number of times','Or repeat until something'];
 const lis=lessons.map(l=>`<div style="display:flex;gap:12px;align-items:center;margin:10px 0"><span style="width:34px;height:34px;border-radius:50%;background:#2BD98E;display:flex;align-items:center;justify-content:center;flex:0 0 auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="#0A0F0E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span style="color:#F4E6C8;font-size:20px;font-weight:800">${l}</span></div>`).join('');
 screen(`${awningSVG()}${floorSVG()}
 <div id="fw" style="position:absolute;inset:0;pointer-events:none"></div>
 <div class="ram" style="position:absolute;top:110px;left:0;right:0;text-align:center;font-size:96px;color:#CB963E;letter-spacing:4px;text-shadow:4px 4px 0 #0A0F0E">LOOP LEGEND!</div>
 <div style="position:absolute;top:240px;left:120px">${chipBlock('proud',150)}</div>
 <div style="position:absolute;top:240px;left:340px;width:200px;text-align:center">${gearSVG(200)}</div>
 <div class="ram" style="position:absolute;top:316px;left:340px;width:200px;text-align:center;color:#CB963E;font-size:22px;line-height:1.35;pointer-events:none">LOOP<br><span style="color:#2BD98E">×100</span></div>
 <div class="panel" style="position:absolute;top:218px;right:120px;width:380px;padding:20px 28px">
  <span class="rivet" style="top:10px;left:10px"></span><span class="rivet" style="top:10px;right:10px"></span><span class="rivet" style="bottom:10px;left:10px"></span><span class="rivet" style="bottom:10px;right:10px"></span>
  <div class="ram" style="color:#CB963E;font-size:26px;margin-bottom:8px">You learned:</div>${lis}</div>
 <div class="panel" style="position:absolute;bottom:110px;left:0;right:0;margin:0 auto;width:fit-content;padding:10px 30px;display:flex;gap:16px;align-items:center">
  ${[0,1,2].map(i=>`<div style="text-align:center;opacity:${S.gears[i]?1:.3}">${gearSVG(56,S.gears[i]?'#CB963E':'#6b5c44')}<div class="ram" style="color:#CB963E;font-size:14px">ACT ${['I','II','III'][i]}</div></div>`).join('')}
  <div class="ram" style="color:#F4E6C8;font-size:20px;margin-left:8px">${stars}/3<br>clean!</div></div>
 <div style="position:absolute;bottom:22px;left:0;right:0;display:flex;gap:20px;justify-content:center">
  <button class="btn cream" id="bReplay">Replay</button></div>`);
 sfx.win();confettiBurst(120);fireworks();
 $('#bReplay').onclick=()=>{sfx.click();resetRun();showTitle()};
 
 post('fk:complete',{stars})}
/* ---------- effects ---------- */
function confettiBurst(n){const cols=['#CB963E','#D94B3A','#2BD98E','#F4E6C8'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='confetti';d.style.cssText=`left:${Math.random()*1150+25}px;top:-20px;background:${cols[i%4]};transform:rotate(${Math.random()*360}deg)`;stage.appendChild(d);d.style.animation=`fall ${1.6+Math.random()*1.4}s ease-in forwards`;setTimeout(()=>d.remove(),3400)}}
function fireworks(){const fw=$('#fw');if(!fw)return;const cols=['#D94B3A','#2BD98E','#CB963E'];for(let k=0;k<3;k++){setTimeout(()=>{if(!$('#fw'))return;const cx=200+k*400+Math.random()*80,cy=120+Math.random()*60;for(let i=0;i<14;i++){const l=document.createElement('div');l.className='firework';const a=i/14*Math.PI*2;l.style.cssText=`left:${cx}px;top:${cy}px;width:5px;height:56px;background:${cols[k%3]};transform:rotate(${a}rad);transform-origin:50% 0;transition:all .8s ease-out`;fw.appendChild(l);requestAnimationFrame(()=>{l.style.transform=`rotate(${a}rad) translateY(-70px)`;l.style.opacity=0});setTimeout(()=>l.remove(),900)}tone(300+k*150,.4,'triangle',.1)},k*700)}}
function puff(x,y){const p=document.createElement('div');p.className='puff';p.style.cssText=`left:${x-35}px;top:${y-35}px;width:70px;height:70px`;stage.appendChild(p);setTimeout(()=>p.remove(),1300)}
/* ---------- drag & drop ---------- */
let dragEl=null,dragKind=null,dragCb=null,dragGhost=null,sx=0,sy=0,moved=false;
function makeDraggable(el,kind,cb){if(!el||el._mkDrag)return;el._mkDrag=true;el.style.touchAction='none';
 el.style.cursor='grab';if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','0');
 el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!S.cranking){e.preventDefault();sfx.click();cb(kind.split(':')[1])}});
 el.addEventListener('pointerdown',e=>{if(S.cranking)return;e.preventDefault();dragEl=el;dragKind=kind;dragCb=cb;sx=e.clientX;sy=e.clientY;moved=false;
  const r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect(),k=sr.width/1200;
  dragGhost=el.cloneNode(true);dragGhost.classList.add('dragging');dragGhost.style.cssText+=`;position:absolute;left:${(r.left-sr.left)/k}px;top:${(r.top-sr.top)/k}px;width:${r.width/k}px;margin:0;z-index:300`;
  el.style.opacity=.35;
  const mv=ev=>{if(!dragEl)return;const dx=(ev.clientX-sx)/k,dy=(ev.clientY-sy)/k;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
   if(moved){if(!dragGhost.parentNode)$('#draglayer').appendChild(dragGhost);dragGhost.style.left=(parseFloat(dragGhost.style.left)+ (ev.movementX||0)/k)+'px';dragGhost.style.top=(parseFloat(dragGhost.style.top)+(ev.movementY||0)/k)+'px'}};
  const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
   if(dragGhost&&dragGhost.parentNode)dragGhost.remove();el.style.opacity='';
   if(moved&&dragEl){ // drop test against program panels
    const pt={x:(ev.clientX-sr.left)/k,y:(ev.clientY-sr.top)/k};
    const zones=[$('#a2Slot'),$('#a3Slot'),$('#blkSlot'),$('#progPanel'),$('#loopPanel'),$('#prog3')].filter(Boolean);
    let hit=null;for(const z of zones){const zr=z.getBoundingClientRect();const zx=(zr.left-sr.left)/k,zy=(zr.top-sr.top)/k,zw=zr.width/k,zh=zr.height/k;
     if(pt.x>zx&&pt.x<zx+zw&&pt.y>zy&&pt.y<zy+zh){hit=z;break}}
    if(hit&&(hit.id==='progPanel'||hit.id==='prog3'||hit.id==='blkSlot')){const card=dragKind.split(':')[1];dragCb(card)}
    else if(hit&&(hit.id==='a2Slot'||hit.id==='a3Slot')&&dragKind.startsWith('card:')){dragCb(dragKind.split(':')[1])}
    else if(!moved){}
   } else if(!moved&&dragEl){ // tap = select/place
    const card=dragKind.split(':')[1];dragCb(card)}
   dragEl=null;dragKind=null;dragCb=null;dragGhost=null};
  addEventListener('pointermove',mv);addEventListener('pointerup',up)})}
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
 if(e.target&&e.target.classList&&e.target.classList.contains('chip-live')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();chipGreet(e.target);return}
 if(e.key==='Escape'){quit();return}
 if(e.key==='m'||e.key==='M'){setMute(!muted);return}
 if(S.screen==='title'&&(e.key==='Enter'||e.key===' ')){showHow();return}
 if(S.screen==='how'&&e.key==='Enter'){$('#bGo').click();return}
 if(S.screen==='act1'&&!S.a1.wrapped&&e.key==='Enter'){dropRepeatA1();return}
 if(S.screen==='act1run'||S.screen==='act2run'||S.screen==='act3run')return;
 if((S.screen==='act1'||S.screen==='act2'||S.screen==='act3')&&e.key==='Enter'){const nx=$('#bNext1')||$('#bNext2')||$('#bFinish');if(nx){nx.click();return}const b=$('#bCrank1')||$('#bDance')||$('#bCrank3');if(b&&!b.disabled)b.click()}});
/* ---------- parent commands (ignore own messages) ---------- */
let mySeq=0;const seen=new Set();
addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object'||!d.type)return;
 if(d.game===GAME&&d._lm)return; // own
 if(d.game&&d.game!==GAME)return; // for a different game
 if(d.type==='fk:mute')setMute(true);
 else if(d.type==='fk:unmute')setMute(false);
 else if(d.type==='fk:restart'){resetRun();showTitle()}
 else if(d.type==='fk:quit')quit()});
const _post=post;post=function(t,x){mySeq++;_post(t,Object.assign({_lm:mySeq},x))};
/* ---------- init ---------- */
showTitle();
