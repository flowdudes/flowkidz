:root{
  --purple:#5B218F; --deep:#3A1468; --ink:#1A0B33;
  --gold:#FFC93D; --cyan:#33DEFF; --pink:#FF9DE0;
  --curtain1:#D63384; --curtain2:#A4125B;
  --paper:#FFFDF6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#12071f;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;overflow:hidden}
#scaler{position:relative}
#stage{position:relative;width:1200px;height:720px;background:radial-gradient(1200px 500px at 50% -80px,#7A35B8 0%,var(--purple) 45%,var(--deep) 100%);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);transform-origin:top left}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
/* curtains */
.curtain{position:absolute;top:0;bottom:0;width:96px;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--curtain1) 0 14px,var(--curtain2) 14px 26px,var(--curtain1) 26px 34px);
  box-shadow:inset -14px 0 24px rgba(0,0,0,.35)}
.curtain.left{left:0;border-radius:22px 0 0 22px}
.curtain.right{right:0;transform:scaleX(-1);border-radius:0 22px 22px 0;box-shadow:inset -14px 0 24px rgba(0,0,0,.35)}
.curtain::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 30%)}
/* spotlight beams */
.beams{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background:
   conic-gradient(from 168deg at 32% 0%, transparent 0deg, rgba(255,255,255,.13) 7deg, transparent 14deg),
   conic-gradient(from 192deg at 68% 0%, transparent 0deg, rgba(255,255,255,.13) 7deg, transparent 14deg)}
.stagefloor{position:absolute;left:0;right:0;bottom:0;height:210px;z-index:1;pointer-events:none;
  background:radial-gradient(700px 190px at 50% 100%, #B565D8 0%, #8B3FBF 55%, transparent 75%)}
/* header */
.hdr{position:absolute;top:0;left:0;right:0;height:66px;z-index:40;display:flex;align-items:center;gap:14px;padding:0 18px 0 172px}
.xbtn{width:56px;height:56px;border-radius:50%;background:#FF5D8F;color:#fff;font-size:26px;font-weight:800;line-height:1;box-shadow:0 4px 0 #B23A63;position:absolute;left:104px;top:8px}
.xbtn:active{transform:translateY(3px);box-shadow:none}
.wordmark{font-family:'Boogaloo';font-size:30px;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:.5px}
.eptabs{display:flex;gap:8px;margin-left:26px}
.eptab{font-family:'Boogaloo';font-size:15px;color:#CBB6EC;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:10px;letter-spacing:1px}
.eptab small{display:block;font-family:'Nunito';font-size:9px;letter-spacing:2px;color:#9d86c4;font-weight:800}
.eptab.cur{background:var(--gold);color:var(--ink);border-color:var(--gold);box-shadow:0 0 14px rgba(255,201,61,.55)}
.eptab.done{background:#7DE8B4;color:var(--ink);border-color:#7DE8B4}
.hdrhearts{margin-left:auto;display:flex;gap:8px;background:rgba(26,11,51,.55);border:2px solid rgba(255,157,224,.4);padding:8px 14px;border-radius:999px}
.hdrhearts svg{width:26px;height:26px}
/* buttons */
.btn{font-family:'Boogaloo';font-size:30px;letter-spacing:1px;padding:14px 44px;border-radius:999px;min-height:64px;min-width:200px;
  color:var(--ink);background:linear-gradient(180deg,#FFD964,var(--gold));box-shadow:0 6px 0 #B8860B,0 10px 24px rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B8860B}
.btn.pink{background:linear-gradient(180deg,#FF7FBF,#F0509A);color:#fff;box-shadow:0 6px 0 #A92E63,0 10px 24px rgba(0,0,0,.35)}
.btn.pink:active{box-shadow:0 2px 0 #A92E63}
.btn.white{background:linear-gradient(180deg,#ffffff,#EDE4F7);box-shadow:0 6px 0 #9d86c4,0 10px 24px rgba(0,0,0,.35)}
.btn.white:active{box-shadow:0 2px 0 #9d86c4}
.btn.ghost{background:rgba(255,255,255,.1);color:#EDE4F7;border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:22px;min-height:56px}
.iconbtn{width:56px;height:56px;border-radius:50%;background:rgba(26,11,51,.6);border:2px solid rgba(255,255,255,.25);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
/* marquee sign */
.marquee{position:relative;background:linear-gradient(180deg,#2A1147,#1E0B36);border:22px solid #F0509A;border-radius:26px;padding:18px 54px 12px;box-shadow:0 12px 40px rgba(0,0,0,.5), inset 0 0 40px rgba(240,80,154,.15)}
.marquee h1{font-family:'Boogaloo';font-size:100px;color:var(--gold);letter-spacing:3px;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 34px rgba(255,201,61,.45);transform:rotate(-1.5deg);white-space:nowrap}
.bulb{position:absolute;width:14px;height:14px;border-radius:50%;background:#5b4a72}
.bulb.lit{animation:blink 1.2s infinite}
@keyframes blink{0%,100%{background:#FFE9A8;box-shadow:0 0 12px 4px rgba(255,201,61,.8)}50%{background:#5b4a72;box-shadow:none}}
/* font buddy */
.buddywrap{display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.buddy{width:120px;height:120px;border-radius:30%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),0 10px 24px rgba(0,0,0,.35);transition:transform .15s}
.buddy .eyes{display:flex;gap:14px;margin-bottom:2px}
.buddy .eye{width:26px;height:30px;background:#fff;border-radius:50%;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.buddy .eye::after{content:"";position:absolute;left:8px;top:11px;width:10px;height:12px;background:var(--ink);border-radius:50%}
.buddy.sad .eye::after{top:16px}
.buddy .glyph{font-size:34px;color:var(--ink);font-weight:400;line-height:1;margin-top:2px}
.buddy.sad{transform:rotate(-4deg)}
.buddy.happy{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.buddy.pick{animation:pickpop .45s ease}
@keyframes pickpop{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-4deg)}100%{transform:scale(1)}}
.podium{width:150px;height:74px;border-radius:10px 10px 14px 14px;position:relative;margin-top:-6px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,0,0,.4), inset 0 4px 0 rgba(255,255,255,.25)}
.podium svg{width:30px;height:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.nametag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:'Boogaloo';font-size:16px;letter-spacing:2px;padding:4px 16px;border-radius:999px;white-space:nowrap;z-index:2}
.pickable{cursor:pointer}
.pickable:hover .buddy{animation:none;transform:translateY(-6px) scale(1.04)}
.pickable.sel .buddy{outline:5px solid var(--gold);outline-offset:4px}
.pickable.dim{opacity:.45;filter:grayscale(.4)}
.cheer{position:absolute;top:-64px;left:50%;transform:translateX(-50%);z-index:3;animation:cheerbounce .7s ease infinite;pointer-events:none}
@keyframes cheerbounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-12px)}}

/* ---- title fidelity + micro-interactions ---- */
.mqtag{font-family:'Sriracha';font-size:26px;color:#FF9DE0;margin-top:2px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.mqheart{position:absolute;width:96px;height:96px;z-index:3;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.mqheart svg{width:100%;height:100%}
.fheart svg{width:100%;height:100%}
.buddy .smile{width:26px;height:13px;border:3px solid #1A0B33;border-top:none;border-left:none;border-right:none;border-radius:0 0 20px 20px;margin:1px 0 3px}
.buddy.sad .smile{transform:rotate(180deg)}
.buddy .eye::after{left:50%;top:50%;transform:translate(-50%,-50%)}
.buddylegs{display:flex;gap:30px;justify-content:center;height:28px;margin-top:-3px}
.buddylegs i{width:8px;height:28px;background:#1A0B33;border-radius:4px;display:block}
.titlebob{animation:bob 3.2s ease-in-out infinite}
.titlechar{cursor:pointer;position:relative;transition:transform .18s ease;border-radius:18px}
.titlechar:hover{animation:none;transform:translateY(-6px)}
.titlechar:focus{outline:4px solid #FFC93D;outline-offset:6px}
.pickable:hover .buddy{animation:none;transform:translateY(-6px) scale(1.04)}
@keyframes charbounce{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-24px) scale(.95,1.08)}60%{transform:translateY(0) scale(1.07,.9)}80%{transform:translateY(-8px) scale(1)}100%{transform:translateY(0) scale(1)}}
.charbounce{animation:charbounce .55s ease}
.heartpop{position:absolute;z-index:50;pointer-events:none;animation:heartfloat .9s ease-out forwards}
.heartpop svg{width:100%;height:100%}
@keyframes heartfloat{0%{transform:translate(-50%,0) scale(.5);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-70px) scale(1.15);opacity:0}}
@keyframes heartpulse{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.pickable.sel .podium svg{animation:heartpulse .55s ease}
.micwaves{position:absolute;left:-14px;top:22px;width:60px;height:70px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5}
body.speaking .micwaves{opacity:1}
.micwaves i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:4px solid #33DEFF;border-radius:50%;opacity:0}
body.speaking .micwaves i{animation:micring 1.6s ease-out infinite}
body.speaking .micwaves i:nth-child(2){animation-delay:.5s}
body.speaking .micwaves i:nth-child(3){animation-delay:1s}
@keyframes micring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* cards */
.card{background:var(--paper);border-radius:20px;box-shadow:0 14px 34px rgba(0,0,0,.4);color:var(--ink)}
.panel{background:rgba(26,11,51,.72);border:2px solid rgba(255,157,224,.35);border-radius:20px;box-shadow:0 14px 34px rgba(0,0,0,.4);backdrop-filter:blur(2px)}
.caption{font-family:'Sriracha';color:#8f7bb5}
.kbtn{position:absolute;z-index:60}
/* confetti */
#confetti{position:absolute;inset:0;z-index:80;pointer-events:none}
/* footer hint */
.foot{position:absolute;bottom:12px;left:0;right:0;text-align:center;z-index:30;font-family:'Nunito';font-weight:700;font-size:15px;color:#CBB6EC;pointer-events:none}
.foot b{color:var(--gold)}
/* speech bubble */
.speech{position:relative;background:#fff;border-radius:16px;padding:14px 18px;font-family:'Sriracha';font-size:20px;color:var(--ink);box-shadow:0 8px 20px rgba(0,0,0,.35);max-width:300px}
.speech::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);border:8px solid transparent;border-right-color:#fff;border-left:none}
/* float hearts */
.fheart{position:absolute;animation:floaty 3.4s ease-in-out infinite;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}
/* applause badge */
.applause{position:absolute;background:rgba(26,11,51,.85);border:2px solid var(--gold);color:var(--gold);font-family:'Boogaloo';letter-spacing:2px;font-size:18px;padding:10px 22px;border-radius:12px;animation:applauseflash .5s ease infinite alternate}
@keyframes applauseflash{from{box-shadow:0 0 6px rgba(255,201,61,.4)}to{box-shadow:0 0 22px rgba(255,201,61,.95)}}
/* result banner */
.bigbanner{font-family:'Boogaloo';font-size:64px;letter-spacing:2px;padding:10px 54px;border-radius:20px;transform:rotate(-2deg);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bigbanner.gold{background:linear-gradient(180deg,#FFD964,var(--gold));color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.4)}
.bigbanner.pink{background:linear-gradient(180deg,#FF7FBF,#F0509A);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
/* ep3 rows */
.frow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;transition:all .2s}
.frow .fname{flex:1;font-size:26px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow.sent{opacity:.45}
.frow.sent .fname{text-decoration:line-through}
.frow.kept{border-color:var(--gold);box-shadow:0 0 16px rgba(255,201,61,.35)}
.gbye{font-family:'Boogaloo';font-size:17px;letter-spacing:1px;padding:10px 18px;border-radius:12px;min-height:56px;min-width:118px;background:#F0509A;color:#fff;box-shadow:0 4px 0 #A92E63}
.gbye:active{transform:translateY(3px);box-shadow:none}
.gbye.back{background:#33DEFF;color:var(--ink);box-shadow:0 4px 0 #1a9ab5}
.gbye.back:active{box-shadow:none}
/* nudge overlay */
.nudge{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(26,11,51,.72)}
.nudgecard{max-width:560px;text-align:center;padding:36px 44px}
/* trophy */
.trophy{filter:drop-shadow(0 12px 24px rgba(0,0,0,.5));animation:trophybob 2.4s ease-in-out infinite}
@keyframes trophybob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.checkitem{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;color:var(--ink);padding:8px 0}
.checkitem .tick{width:34px;height:34px;border-radius:50%;background:#2FBF9B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
/* how cards */
.howcard{width:270px;padding:26px 22px;text-align:center;position:relative}
.howcard .num{font-family:'Boogaloo';font-size:26px;color:#F0509A;letter-spacing:1px}
.howcard p{font-size:17px;font-weight:700;color:#5b4a72;margin-top:8px;line-height:1.45}
.howart{height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
/* misc anims */
.pop-in{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wiggle{animation:wig .5s ease}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.fadeup{animation:fadeup .5s ease both}
@keyframes fadeup{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.shake{animation:shk .5s ease}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.bounce-swap{animation:bswap .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes bswap{0%{transform:scale(.7)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
.preview-flash{animation:pflash .8s ease}
@keyframes pflash{0%{box-shadow:0 0 0 0 rgba(255,201,61,.9)}100%{box-shadow:0 0 0 26px rgba(255,201,61,0)}}
</style>

     line.style.opacity=sent?'.12':'1';line.style.filter=sent?'grayscale(1)':'none';
   });

function checkPair(d,left){

 }
}

/* ============================== keyboard / buttons / init ============================== */
let lastPick=null;
document.addEventListener('keydown',e=>{
 if(e.key==='m'||e.key==='M'){setMute(!muted);return}
 if(e.key==='Escape'){if(cur!=='title')post({type:'fk:quit'});restart();return}
 const k=parseInt(e.key);
 if(cur==='ep1'&&k>=1&&k<=3){const b=$(`#scr-ep1 [data-k="${k}"]`);if(b)b.click()}
 else if(cur==='ep2'&&k>=1&&k<=3){const b=$(`#scr-ep2 [data-k="${k}"]`);if(b)b.click()}
 else if(cur==='ep3'&&k>=1&&k<=5){const b=$(`#scr-ep3 [data-k="${k}"] .gbye`);if(b)b.click()}
 else if((cur==='match'||cur==='nomatch')&&(e.key==='Enter'||e.key===' ')){const b=$('#scr-'+cur+' #nextbtn, #scr-'+cur+' #trybtn');if(b)b.click()}
 else if(cur==='title'&&e.key==='Enter'){$('#startbtn')?.click()}
 else if(cur==='how'&&e.key==='Enter'){$('#readybtn')?.click()}
else if(cur==='win'&&e.key==='Enter'){$('#replaybtn')?.click()}
});
$('#mutebtn').onclick=()=>{setMute(!muted);S.click()};
show('title');
post({type:'fk:ready'});
</script>
