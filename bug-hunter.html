*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0F5C3E;overflow:hidden;font-family:'Nunito',sans-serif;color:#2E4038}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1200px;height:720px;flex:none;position:relative;background:#0F5C3E;overflow:hidden;transform-origin:center center}
#topbar{position:absolute;top:0;left:0;right:0;height:84px;display:flex;align-items:center;gap:14px;padding:0 18px;z-index:50}
.iconbtn{width:56px;height:56px;border-radius:16px;border:4px solid #2E4038;background:#F1DDB0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);flex:none}
.iconbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#gametitle{font-family:'Knewave';font-size:34px;color:#E9FF7A;letter-spacing:1px}
#trail{background:#F1DDB0;border:4px solid #2E4038;border-radius:999px;padding:8px 18px;display:flex;align-items:center;gap:8px;margin-left:6px}
.tnode{width:30px;height:30px;border-radius:50%;border:3px solid #2E4038;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:900;font-size:15px;color:#2E4038}
.tnode.done{background:#2EBF6F}
.tnode.cur{border-color:#FF6B3D;box-shadow:0 0 0 3px #FF6B3D55}
.tdot{width:22px;border-top:4px dotted #8A5A2E}
#jars{background:#F1DDB0;border:4px solid #2E4038;border-radius:16px;padding:4px 12px;display:flex;gap:10px;margin-left:auto;align-items:center}
.jar{width:34px;height:44px;position:relative}
#btnMute{margin-left:0}
#screens{position:absolute;top:84px;left:0;right:0;bottom:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.hidden{display:none!important}
.leafbg{position:absolute;pointer-events:none;opacity:.5}
.bigtitle{font-family:'Knewave';color:#E9FF7A;text-align:center}
.btn{font-family:'Knewave';font-size:26px;color:#2E4038;background:#E9FF7A;border:4px solid #2E4038;border-radius:20px;padding:14px 44px;cursor:pointer;box-shadow:0 6px 0 #2E4038;letter-spacing:1px;min-height:64px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2E4038}
.btn.green{background:#2EBF6F;color:#fff}
.btn.orange{background:#FF6B3D;color:#fff}
.btn.parch{background:#F1DDB0}
.btn.gray{background:#9DB3A6;color:#2E4038}
.btn:disabled{opacity:.5;cursor:default}
.hand{font-family:'Kalam';font-weight:700}
.card{background:#F1DDB0;border:4px solid #2E4038;border-radius:20px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.speech{position:relative;background:#F1DDB0;border:4px solid #2E4038;border-radius:18px;padding:12px 18px;font-weight:800;font-size:19px;max-width:380px;color:#2E4038}
.speech:after{content:'';position:absolute;bottom:-18px;left:44px;border:9px solid transparent;border-top:13px solid #2E4038}
.badgepill{display:inline-flex;align-items:center;gap:6px;background:transparent;border:3px solid #E9FF7A;border-radius:999px;padding:6px 18px;font-weight:900;font-size:16px;color:#E9FF7A}
.readbtn{cursor:pointer;margin-left:8px;vertical-align:middle;display:inline-flex}
/* camp layout */
.campwrap{display:flex;gap:22px;align-items:flex-start;justify-content:center;width:100%}
.stonepanel{background:#0A3B28;border:5px solid #8A5A2E;border-radius:22px;padding:16px;width:320px;flex:none}
.stonepanel .plabel{font-family:'Knewave';color:#E9FF7A;font-size:22px;letter-spacing:1px;margin-bottom:12px;text-align:center}
.stone{font-family:'Nunito';font-weight:900;font-size:19px;color:#2E4038;background:linear-gradient(#fdfdfd,#d9d9d9);border:3px solid #2E4038;border-left:10px solid #2EBF6F;border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;user-select:none;min-height:60px;display:flex;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.stone:active{transform:translateY(2px)}
.stone.buggy{border-left-color:#FF6B3D;animation:bugpulse 1s ease-in-out infinite}
.stone.fixed{border-left-color:#2EBF6F;background:linear-gradient(#eafff1,#c9f2d8)}
.stone.now{border-left-color:#FFC93C;position:relative;padding-right:74px}
.stone.now::after{content:'now';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:'Knewave';font-size:14px;color:#5e3c1c;background:#FFC93C;border-radius:10px;padding:4px 10px 4px 18px;white-space:nowrap}
.stone.now::before{content:'';position:absolute;right:52px;top:50%;transform:translateY(-50%);border:7px solid transparent;border-right:10px solid #5e3c1c;z-index:2}
.stone.armed{outline:4px dashed #E9FF7A;outline-offset:3px}
@keyframes bugpulse{50%{box-shadow:0 0 0 7px rgba(255,107,61,.55)}}
.panelbtns{display:flex;gap:10px;margin-top:6px}
.panelbtns .btn{font-size:20px;padding:10px 0;flex:1;min-height:60px;border-radius:16px}
#campbtns #bStep{font-size:19px;white-space:nowrap}
#bNextCamp{font-size:26px;min-height:76px}
.mapcol{display:flex;flex-direction:column;align-items:center;gap:8px}
.mapframe{background:#F1DDB0;border:6px solid #8A5A2E;border-radius:20px;padding:10px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.plancap{font-family:'Kalam';font-weight:700;font-size:20px;color:#F1DDB0;text-align:center}
.hintpill{position:absolute;right:26px;bottom:20px;background:#F1DDB0;border:3px solid #E9FF7A;border-radius:14px;padding:8px 18px;font-weight:800;font-size:16px;color:#2E4038}
.hintpill.stepmode{top:100px;bottom:auto;max-width:300px;text-align:center}
.hintbanner{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;background:#F1DDB0;border:4px solid #8A5A2E;border-radius:18px;padding:14px 22px;max-width:640px;display:flex;gap:14px;align-items:center;z-index:40;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.hintbanner .hb-t{font-weight:900;font-size:19px}
.hintbanner .hb-s{font-family:'Kalam';font-weight:700;font-size:18px;color:#8A5A2E}
.bigreact{position:absolute;font-family:'Knewave';font-size:64px;z-index:30;pointer-events:none;transform:rotate(-6deg)}
#botdiv{position:absolute;z-index:20;transition:left .3s ease,top .3s ease,transform .3s ease;pointer-events:none}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:#2E4038;color:#fff;font-weight:900;font-size:20px;padding:14px 30px;border-radius:16px;opacity:0;transition:all .25s;z-index:200;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:absolute;top:-20px;width:12px;height:18px;z-index:150;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(780px) rotate(720deg)}}
.shake{animation:shk .4s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.floaty{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-10px)}}
.hintpulse{animation:hpulse .7s ease-in-out 3}
@keyframes hpulse{50%{transform:scale(1.08);box-shadow:0 0 0 7px #E9FF7A}}
#popover{position:absolute;z-index:300;display:none}
.popcard{background:#F1DDB0;border:5px solid #8A5A2E;border-radius:20px;padding:20px 24px;box-shadow:0 10px 0 rgba(0,0,0,.3);text-align:center;min-width:300px}
.popcard h3{font-family:'Knewave';font-size:24px;color:#2E4038;margin-bottom:12px}
.optbtn{font-family:'Nunito';font-weight:900;font-size:20px;background:#fff;color:#2E4038;border:4px solid #2E4038;border-radius:14px;padding:12px 22px;margin:6px;cursor:pointer;min-width:150px;min-height:60px}
.optbtn:active{transform:translateY(2px)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
.stepbtn{width:60px;height:60px;border-radius:50%;border:4px solid #2E4038;background:#2EBF6F;color:#fff;font-size:30px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.stepbtn.minus{background:#FF6B3D}
.stepval{font-family:'Knewave';font-size:52px;min-width:80px;text-align:center}
.splashdrop{position:absolute;border-radius:50%;background:#dff3ff;border:2px solid #6FC3E8;z-index:25;pointer-events:none;animation:sdrop .8s ease-out forwards}
@keyframes sdrop{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6) translateY(26px);opacity:0}}
.woodsign{background-color:#8A5A2E;background-image:repeating-linear-gradient(180deg,transparent 0 30px,rgba(74,47,22,.55) 30px 34px),repeating-linear-gradient(90deg,transparent 0 118px,rgba(74,47,22,.35) 118px 122px);border:6px solid #5e3c1c;border-radius:26px;padding:30px 64px;box-shadow:0 8px 0 rgba(0,0,0,.3);position:relative;transform:rotate(-2.5deg);z-index:1}

.chipLive:hover{transform:rotate(-4deg) scale(1.04)}

@keyframes chipbob{50%{transform:translateY(-8px)}}

.chipLive.hattip .chhat{animation:hattip .55s ease}

  d.style.left=(bx-s/2+(Math.random()*90-45))+'px';d.style.top=(by-s/2+(Math.random()*40-20))+'px';
  d.style.animationDelay=(Math.random()*.3)+'s';mf.appendChild(d);setTimeout(()=>d.remove(),1400)}
 for(let i=0;i<3;i++){const r=document.createElement('div');r.className='ripple';const rs=30+i*26;r.style.width=r.style.height=rs+'px';r.style.left=(bx-rs/2)+'px';r.style.top=(by-rs/2)+'px';r.style.animationDelay=(i*.18)+'s';mf.appendChild(r);setTimeout(()=>r.remove(),1700)}}
function finishMiss(camp,my){if(my!==S.seq||!R||R.done)return;failRun(camp,'miss',my)}
function grabAnim(camp){const my=S.seq;setTimeout(()=>{if(my!==S.seq)return;
 if(camp.kind==='side'){const bg=$('#bananaG');if(bg){bg.style.transition='opacity .4s';bg.style.opacity='0';sfx.pop()}}},350)}
function grabSuccess(camp,my){if(my!==S.seq||!R)return;R.running=false;R.done=true;grabAnim(camp);
 const ci=S.camp-1;setTimeout(()=>{if(my!==S.seq)return;
  bugToJar(ci);sfx.fanfare();confetti(80);S.jars[ci]=true;renderJars();
  $('#campbanner').innerHTML='<div class="hintbanner"><div>'+chipEl('proud',76)+'</div><div style="min-width:0"><div class="hb-t">'+esc(camp.winMsg)+'</div><div class="hb-s">Bug caught! +1 jar · Safari rule: test, watch, fix, run again!</div></div></div>';
  const pc2=$('#plancap');if(pc2)pc2.style.display='none';
  const bb=$('#campbtns');if(bb){bb.innerHTML='<button class="btn big" id="bNextCamp">'+(S.camp<3?'NEXT CAMP':'FINISH SAFARI')+'</button>';
   $('#bNextCamp').onclick=()=>{sfx.pop();if(S.camp<3)showCamp(S.camp+1);else showWin()}}
 },900)}
/* ==== TITLE ==== */
function showTitle(){S.screen='title';S.seq++;closeFix();showTop(false);
 screen(leaves(10)+bigleaves()+vines()+fireflies(7)
 +'<div class="bugglow" style="left:150px;top:300px"></div>'
 +'<div class="floaty" style="position:absolute;left:172px;top:322px;z-index:2">'+bugSVG('#FF6B3D',72)+'</div>'
 +'<div class="floaty" style="position:absolute;right:150px;top:120px;animation-delay:-1.2s">'+bugSVG('#F15BB5',60)+'</div>'
 +'<div class="floaty" style="position:absolute;right:170px;top:452px;z-index:2;animation-delay:-2.1s">'+bugSVG('#4D96FF',64)+'</div>'
 +'<div style="position:relative;text-align:center;z-index:3">'
 +'<div class="rope" style="left:20%"></div><div class="rope" style="right:20%"></div>'
 +'<div class="woodsign" style="margin-top:64px"><div class="bigtitle" style="font-size:92px;line-height:1;text-shadow:0 4px 0 #5e3c1c">BUG HUNTER</div>'
 +'<div class="hand" style="font-size:26px;color:#F1DDB0;margin-top:22px">squash the bugs in the code jungle!</div></div>'
 +'<div style="display:flex;gap:12px;justify-content:center;margin:22px 0">'
 +'<span class="badgepill">3 camps</span><span class="badgepill">3 min</span><span class="badgepill">Debugging</span></div>'
 +'<div style="position:relative;display:inline-block;margin-bottom:10px">'
 +chipEl('happy',150)
 +'<div style="position:absolute;right:-46px;bottom:2px;transform:rotate(-18deg)">'+SVG_MAG.replace('width="46" height="46"','width="72" height="72"')+'</div></div>'
 +'</div>'
 +'<button class="btn" id="bStart" style="position:absolute;right:52px;bottom:40px;z-index:5">START SAFARI</button>');
 $('#bStart').onclick=()=>{sfx.pop();showHow()};post('fk:ready')}
/* ==== HOW TO PLAY ==== */
function showHow(){S.screen='how';S.seq++;showTop(false);
 const sayText='How to hunt bugs. 1. Run. Press Run and watch the robot follow your code. 2. Watch. Where did it go wrong? That is where the bug hides! 3. Squash. Tap the buggy stone, pick a fix, run again.';
 screen(leaves(8)+'<div class="card" style="padding:26px 40px;max-width:980px;text-align:center">'
 +'<div class="hand" style="font-size:34px;color:#5e3c1c">Field notes: how to hunt bugs '+sayBtn(sayText)+'</div>'
 +'<div style="display:flex;gap:18px;margin:20px 0;justify-content:center">'
 +'<div class="card" style="width:270px;padding:18px;background:#fff">'
 +'<div class="btn green" style="font-size:20px;padding:8px 26px;min-height:52px;pointer-events:none">RUN</div>'
 +'<div style="margin:10px 0">'+chipEl('happy',72)+'</div>'
 +'<div class="hand" style="font-size:22px">1. RUN</div><div style="font-weight:700;font-size:16px">Press Run and watch the robot follow your code.</div></div>'
 +'<div class="card" style="width:270px;padding:18px;background:#fff">'
 +'<div class="bigtitle" style="font-size:34px;color:#3E9BE0">SPLASH!</div>'
 +'<div style="margin:10px 0">'+chipEl('worried',72)+'</div>'
 +'<div class="hand" style="font-size:22px">2. WATCH</div><div style="font-weight:700;font-size:16px">Where did it go wrong? That\u2019s where the bug hides!</div></div>'
 +'<div class="card" style="width:270px;padding:18px;background:#fff">'
 +'<div style="position:relative;display:inline-block">'+bugSVG('#FF6B3D',72)+'<svg width="72" height="72" viewBox="0 0 72 72" style="position:absolute;inset:0"><path d="M10 62L62 10" stroke="#FF6B3D" stroke-width="8" stroke-linecap="round"/></svg></div>'
 +'<div class="hand" style="font-size:22px;margin-top:6px">3. SQUASH</div><div style="font-weight:700;font-size:16px">Tap the buggy stone, pick a fix, run again.</div></div>'
 +'</div><button class="btn green" id="bGo">LET\u2019S GO!</button></div>');
 $('#bGo').onclick=()=>{sfx.pop();showCamp(1)}}
/* ==== WIN ==== */
function showWin(){S.screen='win';S.seq++;closeFix();showTop(true);renderTrail();renderJars();
 S.stars=S.misses===0?3:(S.misses<=2?2:1);post('fk:complete',{stars:S.stars});
 const jarsHtml=CAMPS.map((c,i)=>'<div style="text-align:center;min-width:108px"><div style="background:#fff;border:4px solid #2E4038;border-radius:16px;padding:10px 14px">'+jarSVG(BUGCOLORS[i],false).replace('width="34" height="44"','width="52" height="66"')+'</div><div class="hand" style="font-size:17px;margin-top:10px;line-height:1.25">'+c.bugName+'<br>bug</div></div>').join('');
 const starsHtml=[0,1,2].map(i=>SVG_STAR.replace('FILL',i<S.stars?'#FFD93D':'#fff')).join('');
 screen(leaves(12)+'<div style="text-align:center;max-width:1000px">'
 +'<div class="bigtitle" style="font-size:64px">SAFARI COMPLETE!</div>'
 +'<div class="starsrow">'+starsHtml+'</div>'
 +'<div style="display:flex;gap:26px;justify-content:center;align-items:flex-start;margin-top:6px">'
 +'<div class="card" style="padding:18px 26px"><div class="hand" style="font-size:24px;margin-bottom:10px">Your bug collection</div><div style="display:flex;gap:16px">'+jarsHtml+'</div></div>'
 +'<div><div style="width:130px;height:130px;border-radius:50%;background:#E9FF7A;border:6px solid #8A5A2E;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25)">'+bugSVG('#C9A227',84)+'</div><div class="bigtitle" style="font-size:26px;margin-top:8px">BUG BUSTER</div></div>'
 +'<div>'+chipBlock('proud',110)+'</div></div>'
 +'<div class="card" style="padding:14px 26px;margin:16px auto;max-width:640px"><span class="hand" style="font-size:22px">You learned: </span><span style="font-weight:700;font-size:18px">A bug is a mistake in the code. Test, watch, find the stone, fix it and run again!</span></div>'
 +'<div style="display:flex;gap:14px;justify-content:center"><button class="btn parch" id="bAgain">Hunt again</button></div></div>');
 sfx.win();confetti(120);
 $('#bAgain').onclick=()=>{sfx.pop();S.misses=0;S.jars=[false,false,false];resetStones();showCamp(1)};
}
/* ==== keyboard ==== */
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('chipLive'))return;
 if(e.key==='Escape'){if($('#popover').style.display==='block'){closeFix();return}quit();return}
 if(e.key==='m'||e.key==='M'){setMute(!muted);return}
 if($('#popover').style.display==='block'){
  if(e.key==='1'||e.key==='2'){const b=$('#popover .optbtn[data-v="'+(e.key==='1'?'left':'right')+'"]');if(b)b.click();return}
  if(e.key==='-'||e.key==='_'){const b=$('#pMinus');if(b)b.click();return}
  if(e.key==='='||e.key==='+'){const b=$('#pPlus');if(b)b.click();return}
  if(e.key==='Enter'){const b=$('#pGo');if(b)b.click();return}
  return}
 if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('stone'))return;
 if(S.screen==='title'&&e.key==='Enter'){const b=$('#bStart');if(b)b.click()}
 else if(S.screen==='how'&&e.key==='Enter'){const b=$('#bGo');if(b)b.click()}
 else if(S.screen==='camp'){
  if(e.key==='Enter'){if(S.mode==='run'){const b=$('#bRun');if(b)b.click()}else stepNext();return}
  const idx=parseInt(e.key)-1;
  if(idx>=0&&idx<6)onStoneTap(idx)}
 else if(S.screen==='win'&&e.key==='Enter'){const b=$('#bAgain');if(b)b.click()}});
/* ==== parent messages ==== */
addEventListener('message',e=>{
 const d=e.data||{};
 if(!d||typeof d!=='object'||!d.type)return;
 if(d.game==='bug-hunter'&&d._lm)return;
 if(d.game&&d.game!=='bug-hunter')return;
 if(d.type==='fk:mute')setMute(true);
 else if(d.type==='fk:unmute')setMute(false);
 else if(d.type==='fk:restart'){restart();showTitle()}
 else if(d.type==='fk:quit'){quit()}
});
/* ==== responsive fit ==== */
function fit(){const s=$('#stage');const k=Math.min(innerWidth/1200,innerHeight/720);s.style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
setMute(false,true);showTitle();
</script>
