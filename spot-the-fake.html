*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#14131f}
body{font-family:'Gochi Hand',cursive;color:#2A2A36;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#14131f}
#stage{position:relative;width:1200px;height:720px;flex:0 0 auto;transform-origin:center center;overflow:hidden;border-radius:18px;
background-color:#C8955B;
background-image:
 radial-gradient(circle at 12% 22%, rgba(255,255,255,.10) 0 2.5px, transparent 3px),
 radial-gradient(circle at 78% 12%, rgba(120,75,30,.14) 0 3px, transparent 3.6px),
 radial-gradient(circle at 34% 68%, rgba(120,75,30,.10) 0 2px, transparent 2.6px),
 radial-gradient(circle at 62% 82%, rgba(255,255,255,.08) 0 2.6px, transparent 3.2px),
 radial-gradient(circle at 88% 58%, rgba(120,75,30,.12) 0 2.2px, transparent 2.8px),
 radial-gradient(circle at 22% 88%, rgba(255,255,255,.07) 0 2px, transparent 2.6px),
 radial-gradient(circle at 48% 38%, rgba(120,75,30,.08) 0 2.4px, transparent 3px),
 radial-gradient(circle at 8% 52%, rgba(255,255,255,.06) 0 2px, transparent 2.5px);
box-shadow:0 24px 70px rgba(0,0,0,.55)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;border:16px solid #6B4A2A;border-radius:18px;box-shadow:inset 0 0 0 3px #4c3319,inset 0 0 60px rgba(60,35,10,.35);z-index:1}
.screen{position:absolute;inset:0;display:none;z-index:2}
.screen.on{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:4px solid #FFD84D;outline-offset:2px}
/* ---------- type ---------- */
.pm{font-family:'Permanent Marker',cursive}
.lon{font-family:'Londrina Solid',cursive;font-weight:900}
.gochi{font-family:'Gochi Hand',cursive}
/* ---------- topbar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;height:78px;background:#2A2A36;display:none;align-items:center;gap:14px;padding:0 18px;z-index:60;border-bottom:4px solid #1b1b26}
#topbar.on{display:flex}
#tb-quit{width:56px;height:56px;border-radius:14px;background:#3d3d52;display:flex;align-items:center;justify-content:center}
#tb-title{font-family:'Permanent Marker',cursive;color:#fff;font-size:30px;letter-spacing:1px;flex:0 0 auto}
#tb-tabs{display:flex;gap:10px;margin-left:26px}
.tb-tab{display:flex;align-items:center;gap:7px;background:#3d3d52;border-radius:10px;padding:7px 12px 7px 9px;color:#cfcfe0;font-family:'Londrina Solid';font-weight:400;font-size:17px}
.tb-tab .mini{width:30px;height:22px;border-radius:3px;background:#FBF7EC;position:relative;overflow:hidden}
.tb-tab .mini::before{content:"";position:absolute;top:4px;left:4px;right:4px;height:5px;background:#8a8aa0}
.tb-tab .mini::after{content:"";position:absolute;top:12px;left:4px;right:10px;height:3px;background:#b9b9cc}
.tb-tab.act{background:#FFD84D;color:#2A2A36}
.tb-tab.done{background:#1F9D5A;color:#fff}
#tb-dots{margin-left:auto;display:flex;gap:10px;align-items:center}
.tdot{width:40px;height:40px;border-radius:50%;border:3px dashed #6a6a85;display:flex;align-items:center;justify-content:center;color:#6a6a85;font-size:15px;font-family:'Londrina Solid'}
.tdot.ok{border:3px solid #1F9D5A;background:#1F9D5A;color:#fff;font-size:20px}
#tb-mute{width:56px;height:56px;border-radius:14px;background:#3d3d52;display:flex;align-items:center;justify-content:center}
/* ---------- shared bits ---------- */
.pin{position:absolute;width:30px;height:30px;z-index:5;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.clip{position:absolute;background:#FBF7EC;border-radius:4px;box-shadow:0 6px 14px rgba(40,20,5,.35);padding:18px 20px 22px}
.cardline{height:7px;background:#d8d2c0;border-radius:4px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:64px;padding:14px 44px;border-radius:40px;font-family:'Permanent Marker',cursive;font-size:26px;color:#fff;background:#E23B3B;box-shadow:0 6px 0 #a81f1f,0 10px 18px rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a81f1f}
.btn.dark{background:#2A2A36;box-shadow:0 6px 0 #14141f,0 10px 18px rgba(0,0,0,.3)}
.btn.dark:active{box-shadow:0 2px 0 #14141f}
.btn.ghosty{background:#FBF7EC;color:#2A2A36;box-shadow:0 6px 0 #cfc8b4,0 10px 18px rgba(0,0,0,.25)}
.coach{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;background:#2A2A36;color:#fff;border-radius:16px;padding:12px 26px;font-size:22px;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.35);white-space:nowrap}
.coach b{color:#FFD84D}
.hintline{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;font-size:24px;color:#2A2A36;z-index:30;background:rgba(251,247,236,.85);padding:8px 26px;border-radius:30px}
.dim{position:absolute;inset:0;background:rgba(20,18,28,.55);z-index:70;display:none}
.dim.on{display:block}
.stampmark{position:absolute;z-index:6;pointer-events:none;transform:rotate(-9deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.splat{position:absolute;width:120px;height:120px;z-index:7;pointer-events:none;opacity:0}
@keyframes splatpop{0%{opacity:1;transform:scale(.2) rotate(-9deg)}60%{opacity:1;transform:scale(1.25) rotate(-9deg)}100%{opacity:0;transform:scale(1.6) rotate(-9deg)}}
.splat.go{animation:splatpop .45s ease-out}
@keyframes stampin{0%{transform:scale(2.6) rotate(-30deg);opacity:0}55%{transform:scale(.94) rotate(-7deg);opacity:1}75%{transform:scale(1.06) rotate(-10deg)}100%{transform:scale(1) rotate(-9deg)}}
.stampmark.slam{animation:stampin .38s ease-out}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.shakex{animation:shakeX .3s ease-in-out 2}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.floaty{animation:floaty 3s ease-in-out infinite}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.popin{animation:popin .35s ease-out}
@keyframes stringdraw{to{stroke-dashoffset:0}}
.redstring{fill:none;stroke:#E23B3B;stroke-width:4;stroke-linecap:round}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.cf{position:absolute;width:12px;height:18px;top:-24px;opacity:0}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(800px) rotate(720deg)}}
/* say button */
.saybtn{width:56px;height:56px;border-radius:50%;background:#2A2A36;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #14141f;flex:0 0 auto}
.readbtn{width:56px;height:56px;border-radius:50%;background:#2A2A36;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #14141f;flex:0 0 auto;border:0;cursor:pointer;vertical-align:middle}
.readbtn:active{transform:translateY(2px);box-shadow:none}
.saybtn:active{transform:translateY(2px);box-shadow:none}

    <div class="gochi" style="font-size:23px;margin-top:12px">You checked 3 editions and caught every fake.</div>
  </div>
  <div class="clip popin" style="left:700px;top:120px;width:400px;padding:0 0 18px;overflow:hidden;transform:rotate(1.5deg)">
    <div class="pm" style="background:#E23B3B;color:#fff;font-size:30px;text-align:center;padding:10px">PRESS PASS</div>
    <div style="padding:16px 22px;display:flex;gap:16px;align-items:center">
      <div style="width:90px;height:110px;background:#cfe0f5;border-radius:8px;overflow:hidden;flex:0 0 auto">${globo('happy',90)}</div>
      <div><div class="lon" style="font-size:26px">FACT CHECKER</div><div class="gochi" style="font-size:19px;color:#5a5a6e">Level 1</div>
      <div class="stampmark" style="position:relative;margin-top:6px">${stampSVG('OK','#1F9D5A',110)}</div></div>
    </div>
  </div>
  <div class="popin" style="position:absolute;left:700px;top:440px;width:400px;background:#2A2A36;border-radius:16px;padding:18px 24px">
    <div class="pm" style="color:#FFD84D;font-size:24px">YOU LEARNED:</div>
    <div class="gochi" style="color:#fff;font-size:21px;margin-top:6px">Check the source, look for clues, and think before you share. ${readBtn('You learned: check the source, look for clues, and think before you share.','what you learned')}</div>
  </div>
  <div style="position:absolute;left:700px;top:610px;display:flex;gap:18px">
    <button class="btn ghosty" id="btn-replay">Replay</button>
    
  </div>`;
 sfx.win();confetti();
 post('fk:complete',{stars});
 $('#btn-replay').addEventListener('click',()=>{sfx.pop();S.misses=[0,0,0];S.doneEditions=[false,false,false];startEdition(0)});
 
 show('win');
}
/* extra css for held stamps */
const st2=document.createElement('style');st2.textContent=`.stamp-tool{border-radius:12px;transition:transform .15s ease;cursor:pointer}.stamp-tool:hover{transform:translateY(-6px)}.stamp-tool:hover svg{filter:drop-shadow(0 10px 10px rgba(0,0,0,.35))}.stamp-tool.held{outline:4px solid #FFD84D;transform:scale(1.06) rotate(-4deg)}.stamp-tool.held svg{filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}`;document.head.appendChild(st2);
const st3=document.createElement('style');st3.textContent=`
/* title newspaper sway */
.news-sway{transform:rotate(-2deg);transform-origin:260px 7px;animation:newsway 5s ease-in-out infinite}
@keyframes newsway{0%,100%{transform:rotate(-2.9deg)}50%{transform:rotate(-1.1deg)}}
#tstr1{transform-origin:195px 318px;animation:stringsway 5s ease-in-out infinite}
#tstr2{transform-origin:995px 206px;animation:stringsway 5s ease-in-out infinite}
@keyframes stringsway{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
/* Globo interactivity: hover tilt, tap hop */
.globo-live{cursor:pointer;transition:transform .18s ease}
.globo-live:hover{transform:rotate(-4deg) scale(1.05)}
.globo-live:focus-visible{outline:4px solid #FFD84D;border-radius:18px}
.globo-live.greet{animation:globohop .55s ease}
@keyframes globohop{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-26px) rotate(5deg)}60%{transform:translateY(0) rotate(-3deg)}80%{transform:translateY(-9px) rotate(0)}100%{transform:translateY(0) rotate(0)}}
/* pin wobble on card hover */
.pin{transform:rotate(var(--pr,0deg));transform-origin:50% 18%}
.clip:hover .pin{animation:pinwob .5s ease}
@keyframes pinwob{0%,100%{transform:rotate(var(--pr,0deg))}25%{transform:rotate(calc(var(--pr,0deg) - 9deg))}75%{transform:rotate(calc(var(--pr,0deg) + 9deg))}}
@media (prefers-reduced-motion:reduce){.floaty,.news-sway,#tstr1,#tstr2,.globo-live,.pin,.stamp-tool{animation:none!important;transition:none!important}}
`;document.head.appendChild(st3);
/* Globo tap -> happy hop + sound (delegated, keyboard accessible) */
function globoGreet(el){if(!el||el.classList.contains('greet'))return;el.classList.add('greet');sfx.pop();setTimeout(()=>el.classList.remove('greet'),600)}
document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('.globo-live');if(g)globoGreet(g)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('globo-live')){e.preventDefault();globoGreet(e.target)}});
try{if(matchMedia('(prefers-reduced-motion: reduce)').matches){$$('#stage animateTransform').forEach(a=>a.remove())}}catch(e){}
/* ================= init + parent commands ================= */
addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.screen==='morning'||S.screen==='noon'||S.screen==='evening'){if(!$('#morn-dim').classList.contains('on')&&!$('#eve-dim').classList.contains('on'))quitToTitle()}}
});
addEventListener('message',e=>{
 const d=e.data||{};
 if(d._lm&&d.game===SLUG)return;               /* ignore own outgoing */
 if(d.game&&d.game!==SLUG)return;              /* addressed to another game */
 const t=d.type||d.command;
 if(t==='fk:mute')setMute(true);
 else if(t==='fk:unmute')setMute(false);
 else if(t==='fk:quit')quitToTitle();
 else if(t==='fk:restart'){S.misses=[0,0,0];S.doneEditions=[false,false,false];startEdition(0)}
});
show('title');
post('fk:ready');
</script>
