.cloud::after{content:'';position:absolute;background:#fff;border-radius:999px}

.tape{position:absolute;background:#ffc531;color:#23232e;font-family:'Luckiest Guy';font-size:15px;padding:7px 14px;transform:rotate(-3deg);box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
/* ---------- top bar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;height:86px;display:flex;align-items:center;gap:14px;padding:0 22px;z-index:60;pointer-events:none}
#topbar>*{pointer-events:auto}
.iconbtn{width:56px;height:56px;border-radius:16px;border:4px solid #23232e;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);flex:none}
.iconbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
#gametitle{font-family:'Luckiest Guy';font-size:30px;color:#23232e;text-shadow:2px 2px 0 #fff}
#floorhud{margin-left:auto;display:flex;align-items:center;gap:8px;background:#23232e;color:#ffc531;font-family:'Luckiest Guy';font-size:17px;padding:10px 14px;border-radius:16px;border:3px solid #101016}
#floorhud .fl{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#3a3a48;color:#8b8b9a;font-size:18px}
#floorhud .fl.done{background:#2bc20e;color:#fff}
#floorhud .fl.now{background:#ffc531;color:#23232e;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
#hathud{display:flex;align-items:center;gap:6px;background:#fff;border:4px solid #23232e;border-radius:16px;padding:6px 12px;min-width:120px;justify-content:center}
#hathud .hat{width:34px;height:26px}
/* ---------- screens ---------- */
#screens{position:absolute;inset:0;z-index:10;padding-top:96px}
.screen{position:absolute;inset:0;padding:96px 30px 130px}
.hidden{display:none!important}
/* ---------- webby ---------- */
.webby{position:absolute;z-index:20}
.webby .bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.speech{position:absolute;background:#fff;border:4px solid #23232e;border-radius:18px;padding:12px 16px;font-weight:800;font-size:18px;color:#23232e;max-width:300px;z-index:21;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.speech::after{content:'';position:absolute;bottom:-14px;left:34px;width:20px;height:20px;background:#fff;border-right:4px solid #23232e;border-bottom:4px solid #23232e;transform:rotate(45deg)}
.speech .say{margin-left:8px;cursor:pointer;font-size:20px}
/* ---------- browser window ---------- */
.browser{background:#fff;border-radius:18px;border:5px solid #aebdd6;box-shadow:0 10px 0 rgba(35,35,46,.12);overflow:hidden;position:relative}
.b-bar{background:#e8eefc;padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:3px solid #d5ddf0}
.b-dot{width:14px;height:14px;border-radius:50%}
.b-url{flex:1;background:#fff;border-radius:999px;padding:5px 16px;font-size:14px;color:#7a86a0;font-weight:700;max-width:340px}
/* ---------- blocks & slots ---------- */
.block{border:4px solid #23232e;border-radius:16px;padding:14px 20px;font-weight:900;font-size:19px;color:#23232e;background:#fff;cursor:grab;box-shadow:0 5px 0 rgba(0,0,0,.18);text-align:center;touch-action:none;min-height:56px;display:flex;align-items:center;justify-content:center}
.block.blue{background:#2f7bff;color:#fff;border-radius:999px}
.block.drag-src{opacity:.35}
.block.selected{outline:5px solid #ffc531;outline-offset:3px}
.slot{border:4px dashed #c9a227;border-radius:14px;background:#fff8df;display:flex;align-items:center;justify-content:center;color:#a8842a;font-weight:800;font-size:17px;min-height:64px;transition:all .15s}
.slot.hover{border-color:#2f7bff;background:#e3efff;transform:scale(1.03)}
.slot.filled{border-style:solid;border-color:#2bc20e;background:#eaffe9}
.slot.errflash{border-color:#ff3b3b;background:#ffe3e3;animation:shake .4s}
.slot.glow{animation:slotglow 1s infinite}
@keyframes slotglow{50%{box-shadow:0 0 0 8px rgba(255,197,49,.55)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#dragghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08);box-shadow:0 14px 30px rgba(0,0,0,.35);opacity:.96}
/* ---------- buttons ---------- */
.btn{font-family:'Luckiest Guy';font-size:24px;padding:16px 44px;border-radius:999px;border:4px solid #23232e;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);letter-spacing:1px;min-height:64px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.yellow{background:#ffc531;color:#23232e}
.btn.green{background:#2bc20e;color:#fff}
.btn.white{background:#fff;color:#23232e}
.btn.blue{background:#2f7bff;color:#fff}
#foot{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:18px;z-index:55}
/* ---------- inspector clipboard ---------- */
.clip{background:#fffdf4;border:5px solid #c98a3d;border-radius:14px;padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.15);position:relative;min-width:250px}
.clip::before{content:'';position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:90px;height:28px;background:#9aa5b8;border-radius:8px;border:3px solid #6e7889}
.clip h4{font-family:'Luckiest Guy';font-size:20px;text-align:center;margin-bottom:10px;color:#23232e;letter-spacing:1px}
.clip .row{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:#23232e;padding:7px 0}
.badge{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;border:3px solid #23232e}
.badge.ok{background:#2bc20e;color:#fff;border-color:#1d8a0a}
.badge.no{background:#ff3b3b;color:#fff;border-color:#b02323}
.badge.todo{background:#fff;color:#b9b9c6;border-color:#c9c9d4}
/* ---------- hint panel ---------- */
.hintpanel{background:#23232e;color:#fff;border-radius:16px;padding:16px 20px;max-width:300px;z-index:40;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.hintpanel h4{font-family:'Luckiest Guy';color:#ffc531;font-size:20px;margin-bottom:8px;letter-spacing:1px}
.hintpanel p{font-weight:700;font-size:16px;line-height:1.45}
/* ---------- bonk ---------- */
#bonk{position:fixed;z-index:9998;opacity:0;pointer-events:none;font-family:'Luckiest Guy';font-size:64px;color:#ff5a5a;text-shadow:3px 3px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;transform:translate(-50%,-50%) rotate(-8deg)}
#bonk.show{animation:bonkpop .7s ease-out}
@keyframes bonkpop{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(.3);opacity:0}25%{transform:translate(-50%,-60%) rotate(-8deg) scale(1.25);opacity:1}70%{transform:translate(-50%,-75%) rotate(-8deg) scale(1);opacity:1}100%{transform:translate(-50%,-95%) rotate(-8deg) scale(1);opacity:0}}
/* ---------- stamp ---------- */
.stamp{position:absolute;font-family:'Luckiest Guy';font-size:54px;color:#2bc20e;border:8px solid #2bc20e;border-radius:18px;padding:10px 26px;transform:rotate(-10deg);background:rgba(255,255,255,.85);z-index:50;letter-spacing:2px}
.stamp.show{animation:stampin .5s cubic-bezier(.2,2.4,.4,1)}
@keyframes stampin{0%{transform:rotate(-10deg) scale(1.6);opacity:0}60%{transform:rotate(-10deg) scale(.94);opacity:1}100%{transform:rotate(-10deg) scale(1)}}
/* ---------- confetti ---------- */
.cfetti{position:fixed;width:12px;height:18px;z-index:9997;pointer-events:none;border-radius:2px}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#23232e;color:#fff;font-weight:800;font-size:18px;padding:14px 26px;border-radius:999px;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- misc ---------- */
.handle{width:34px;height:34px;background:#ffc531;border:4px solid #23232e;border-radius:9px;cursor:grab;position:absolute;touch-action:none;box-shadow:0 3px 0 rgba(0,0,0,.2);z-index:5}
.handle::before{content:'';position:absolute;inset:-11px}
.handle:active{cursor:grabbing}
.dashedbox{border:4px dashed #c9a227;border-radius:12px;position:relative}
.crane-cable{position:absolute;background:#5a5a6a;width:6px;border-radius:3px;z-index:4}
.crane-hook{position:absolute;z-index:4}
.bigtitle{font-family:'Luckiest Guy';color:#23232e;text-align:center}
.readbtn{cursor:pointer;margin-left:10px;font-size:22px;vertical-align:middle}
.readbtn svg{vertical-align:middle}
/* ---------- micro-interactions ---------- */
.btn{transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-3px);box-shadow:0 9px 0 rgba(0,0,0,.25)}
.iconbtn{transition:transform .12s}
.iconbtn:hover{transform:translateY(-2px) scale(1.06)}
.webby{cursor:pointer;transition:transform .18s ease}
.webby:hover{transform:rotate(-3deg) translateY(-3px)}
.webby .webby-hat{transition:transform .35s ease;transform-box:fill-box;transform-origin:50% 92%}
.webby.hat-tip .webby-hat{transform:rotate(-24deg) translateY(-6px)}
.webby.hat-tip{animation:webbyhop .55s ease}
@keyframes webbyhop{30%{transform:translateY(-14px) rotate(2deg)}65%{transform:translateY(0) rotate(0)}}
@keyframes hooksway{0%,100%{transform:rotate(1.4deg)}50%{transform:rotate(-1.4deg)}}
#hookBlocks{transform-origin:top center;animation:hooksway 3.6s ease-in-out infinite}
@keyframes chipin{0%{transform:scale(1.35,.6)}55%{transform:scale(.92,1.08)}100%{transform:scale(1)}}
.chipin{animation:chipin .38s ease-out}
@keyframes stageshake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}}
#screens.shake{animation:stageshake .4s}
.dustpuff{position:fixed;z-index:9998;pointer-events:none;border-radius:50%;background:#d8c49a;opacity:.9}
@keyframes starpop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.starpop{display:inline-block;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes hathudshake{25%{transform:translateX(-6px) rotate(-2deg)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
#hathud.shake{animation:hathudshake .35s}
@keyframes dashmove{to{stroke-dashoffset:-24}}
.dragpath{stroke-dasharray:10 14;animation:dashmove 1.1s linear infinite}
.xbadge{position:absolute;top:-14px;right:-14px;width:38px;height:38px;border-radius:50%;background:#ff3b3b;border:4px solid #fff;display:flex;align-items:center;justify-content:center;z-index:6;box-shadow:0 3px 0 rgba(0,0,0,.25);animation:starpop .35s}
#ground .speck{position:absolute;border-radius:50%;background:#a9783f;opacity:.65}
@media (prefers-reduced-motion:reduce){
  .webby .bob,#hookBlocks,.dragpath,.starpop{animation:none!important}
  .btn:hover,.iconbtn:hover,.webby:hover{transform:none}
  #screens.shake,#hathud.shake{animation:none}
}
@media (max-width:700px){.speech{font-size:16px}}
</style>
</head>

<div id="viewport"><div id="stage">
  <div id="ground"><div class="speck" style="left:6%;bottom:34px;width:16px;height:11px"></div><div class="speck" style="left:14%;bottom:66px;width:12px;height:9px"></div><div class="speck" style="left:23%;bottom:28px;width:18px;height:12px"></div><div class="speck" style="left:33%;bottom:70px;width:11px;height:8px"></div><div class="speck" style="left:44%;bottom:36px;width:15px;height:10px"></div><div class="speck" style="left:55%;bottom:64px;width:12px;height:9px"></div><div class="speck" style="left:64%;bottom:30px;width:17px;height:11px"></div><div class="speck" style="left:74%;bottom:68px;width:11px;height:8px"></div><div class="speck" style="left:83%;bottom:34px;width:16px;height:11px"></div><div class="speck" style="left:92%;bottom:62px;width:12px;height:9px"></div></div>
  <div id="topbar" class="hidden">
    <div class="iconbtn" id="btnQuit" title="Quit"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="#23232e" stroke-width="5" stroke-linecap="round"/></svg></div>

/* Drag ghost follows pointer; drop detected via elementFromPoint (ghost has pointer-events:none) */
function dragify(el,opts){
  opts=opts||{};
  let sx,sy,ghost=null,dragging=false,moved=0,pid=null;
  el.style.touchAction='none';
  el.addEventListener('pointerdown',e=>{
    if(el.dataset.locked==='1')return;
    e.preventDefault();pid=e.pointerId;sx=e.clientX;sy=e.clientY;moved=0;dragging=false;
    try{el.setPointerCapture(pid)}catch(err){}
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    moved=Math.max(moved,Math.hypot(e.clientX-sx,e.clientY-sy));
    if(!dragging&&moved>8){dragging=true;startGhost(e)}
    if(dragging){moveGhost(e);if(opts.onMove)opts.onMove(e,ghost)}
  });
  const up=e=>{
    if(e.pointerId!==pid)return;pid=null;
    if(dragging){endGhost(e)}else if(moved<=8&&opts.onTap){opts.onTap(e)}
    dragging=false;
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  function startGhost(e){
    ghost=el.cloneNode(true);ghost.id='dragghost';ghost.style.width=el.offsetWidth+'px';
    document.body.appendChild(ghost);moveGhost(e);el.classList.add('drag-src');
    if(opts.onStart)opts.onStart(e);
  }
  function moveGhost(e){if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}}
  function endGhost(e){
    const x=e.clientX,y=e.clientY;
    if(ghost)ghost.remove();ghost=null;el.classList.remove('drag-src');
    const under=document.elementFromPoint(x,y);
    const slot=under?under.closest('[data-slot]'):null;
    if(opts.onDrop)opts.onDrop(slot,under,{x,y});
  }
}

          const pr=b.getBoundingClientRect(),sr=$('#stage').getBoundingClientRect(),s=sr.width/1200;
          const ring=$('#bossRing');
          ring.style.left=((pr.left-sr.left)/s-14)+'px';ring.style.top=((pr.top-sr.top)/s-12)+'px';
          ring.style.width=(pr.width/s+28)+'px';ring.style.height=(pr.height/s+24)+'px';
          ring.classList.remove('hidden');
          b.dataset.locked='1';
          $('#f3instr').innerHTML='Boss picked! Swing the ball at the extras!'+sayBtn('Boss picked! Swing the ball at the extras!');
          $('#f3hint').classList.add('hidden');
          toast('Drag the wrecking ball onto the extra buttons!');
          $('#f3webby').innerHTML=webbySVG('cheer',104);
        }else{
          misses++;missN++;floorMisses[3]++;
          boom(e.clientX,e.clientY);updateHats(true);
          b.classList.add('errflash');setTimeout(()=>b.classList.remove('errflash'),450);
          $('#f3webby').innerHTML=webbySVG('worried',104);
          setTimeout(()=>{if(cur==='floor3')$('#f3webby').innerHTML=webbySVG('idle',104)},1200);
          if(missN>=2)$('#f3hint').classList.remove('hidden');
        }
      }else if(phase==='smash'&&b.dataset.extra&&b.style.visibility!=='hidden'){
        // tap-to-smash fallback
        smash(b);
      }
    });
  });
  // phase B: drag the ball
  ball.addEventListener('pointerdown',e=>{
    if(phase!=='smash'||cur!=='floor3')return;
    e.preventDefault();pid=e.pointerId;dragging=true;try{ball.setPointerCapture(pid)}catch(err){}ball.style.cursor='grabbing';ball.style.pointerEvents='none';
  });
  ball.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid||!dragging)return;
    const a=stageToClient(AX,AY);
    angle=Math.max(-1.1,Math.min(0.8,Math.atan2(e.clientX-a.x,e.clientY-a.y)));
    renderBall();
  });
  const bup=e=>{
    if(e.pointerId!==pid)return;pid=null;dragging=false;ball.style.cursor='grab';ball.style.pointerEvents='';
    if(phase!=='smash'||cur!=='floor3')return;
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const tgt=under?under.closest('.extra-btn'):null;
    if(tgt&&tgt.style.visibility!=='hidden'&&!tgt.dataset.boss){smash(tgt)}
    else swingBack();
  };
  ball.addEventListener('pointerup',bup);ball.addEventListener('pointercancel',bup);
  renderBall();
}
